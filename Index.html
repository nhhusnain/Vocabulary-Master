<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vocabulary Master</title><meta name="theme-color" content="#1b1340"><link rel="icon" href="icon.png">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,sans-serif;background:linear-gradient(160deg,#1b1340,#2d1b69);color:#fff}
.wrap{max-width:480px;margin:auto;padding:14px}.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;margin-bottom:14px}
.card{background:#ffffff1a;border-radius:20px;padding:20px;margin-bottom:14px}.word{font-size:36px;font-weight:800;margin:4px 0}.pos{color:#c9bfff;font-style:italic}.mean{font-size:18px;margin:10px 0}.ex{color:#c9bfff;font-size:15px}.h{font-size:13px;color:#c9bfff;text-align:center}
.row{display:flex;gap:10px}button{flex:1;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;color:#fff;background:#7c5cff}button.g{background:#ffffff22}
</style></head><body><div class="wrap">
<div class="logo"><svg width="36" height="36" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#7c5cff"/><path d="M12 26h18c3 0 2 2 2 2v26s1-3-2-3H12z M52 26H34c-3 0-2 2-2 2v26s-1-3 2-3h18z" fill="#fff"/><path d="M32 5l3.5 7 7.5 1-5.5 5.2 1.4 7.6L32 22l-6.9 3.8 1.4-7.6L21 13l7.5-1z" fill="#ffc83d"/></svg>Vocabulary Master</div>
<div id="nt"></div><div id="v"></div></div>
<script type="module">
const L=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},S=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let notice=L("vm_notice",""),words=L("vm_words",[]),pos=L("vm_pos",0);
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){
 $("#nt").innerHTML=notice?`<div class="card">📢 ${esc(notice)}</div>`:"";
 if(!words.length){$("#v").innerHTML='<div class="card">Words load ho rahe hain… internet check karo.</div>';return}
 pos=((pos%words.length)+words.length)%words.length;S("vm_pos",pos);const w=words[pos];
 $("#v").innerHTML=`<div class="card"><div class="word">${esc(w[0])}</div><div class="pos">${esc(w[1])}</div><div class="mean">${esc(w[2])}</div>${w[3]?`<div class="ex">“${esc(w[3])}”</div>`:""}${w[4]?`<div class="mean" dir="rtl">🇵🇰 ${esc(w[4])}</div>`:""}</div>
 <div class="row"><button class="g" onclick="mv(-1)">◀ Previous</button><button onclick="mv(1)">Next ▶</button></div><div class="h" style="margin-top:12px">${pos+1} / ${words.length}</div>`}
window.mv=d=>{pos+=d;render()};
addEventListener("keydown",e=>{if(e.key=="ArrowRight")mv(1);if(e.key=="ArrowLeft")mv(-1)});
